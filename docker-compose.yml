services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bpm}
      POSTGRES_USER: ${POSTGRES_USER:-bpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bpm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: bpm:latest
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      - DJANGO_SETTINGS_MODULE=bpm.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-bpm}
      - POSTGRES_USER=${POSTGRES_USER:-bpm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SMTP_SENDER_EMAIL=${SMTP_SENDER_EMAIL:-noreply@denog.de}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-DENOG Event Team}
      - EMAIL_BCC_ADDRESS=${EMAIL_BCC_ADDRESS:-sascha@denog.de}
      - PRETIX_API_TOKEN=${PRETIX_API_TOKEN:-}
      - PRETIX_EVENT=${PRETIX_EVENT:-}
      - PRETIX_ORGANIZER=${PRETIX_ORGANIZER:-denog}
      - PRETIX_CHECKIN_LIST_ID_LOCAL=${PRETIX_CHECKIN_LIST_ID_LOCAL:-}
      - PRETIX_CHECKIN_LIST_ID_GLOBAL=${PRETIX_CHECKIN_LIST_ID_GLOBAL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
