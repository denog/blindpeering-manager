services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bpm}
      POSTGRES_USER: ${POSTGRES_USER:-bpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./postgresdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bpm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bpm:latest
    # Stable DNS name other containers (e.g. a Caddy stack on a shared
    # network) can proxy to: ${APP_CONTAINER_NAME}:${APP_PORT}
    container_name: ${APP_CONTAINER_NAME:-bpm-app}
    ports:
      # Loopback-only by default so traffic goes through the reverse proxy;
      # set APP_BIND_ADDR=0.0.0.0 to expose the app directly.
      - "${APP_BIND_ADDR:-127.0.0.1}:${APP_HOST_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      - DJANGO_SETTINGS_MODULE=bpm.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-bpm}
      - POSTGRES_USER=${POSTGRES_USER:-bpm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Internal DNS names (container name + alias) are always allowed so
      # reverse proxies and health checks can address the app by its Docker
      # identity (e.g. bpm:8080) in addition to the public hostname(s).
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost},${APP_CONTAINER_NAME:-bpm-app},${APP_NETWORK_ALIAS:-bpm}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SMTP_SENDER_EMAIL=${SMTP_SENDER_EMAIL:-noreply@denog.de}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-DENOG Event Team}
      - EMAIL_BCC_ADDRESS=${EMAIL_BCC_ADDRESS:-sascha@denog.de}
      - PRETIX_API_TOKEN=${PRETIX_API_TOKEN:-}
      - PRETIX_EVENT=${PRETIX_EVENT:-}
      - PRETIX_ORGANIZER=${PRETIX_ORGANIZER:-denog}
      - PRETIX_CHECKIN_LIST_ID_LOCAL=${PRETIX_CHECKIN_LIST_ID_LOCAL:-}
      - PRETIX_CHECKIN_LIST_ID_GLOBAL=${PRETIX_CHECKIN_LIST_ID_GLOBAL:-}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      - CARPOOL_MESSAGE_RETENTION_DAYS=${CARPOOL_MESSAGE_RETENTION_DAYS:-3}
      - CARPOOL_IP_RATE_PER_HOUR=${CARPOOL_IP_RATE_PER_HOUR:-8000}
      # Runtime server config (see Dockerfile CMD / entrypoint)
      - PORT=${APP_PORT:-8080}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
    networks:
      default:
        aliases:
          - ${APP_NETWORK_ALIAS:-bpm}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import os, urllib.request; urllib.request.urlopen(''http://127.0.0.1:'' + os.environ.get(''PORT'', ''8080'') + ''/api/health/'', timeout=5)"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
