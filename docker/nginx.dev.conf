# Gateway for docker-compose.dev.yml: one origin for the SPA, Django and Mailpit.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the scheme set by an outer TLS proxy (Caddy); fall back to our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8000;
    client_max_body_size 20m;

    # Relative redirects, so they work behind the outer proxy's https/port.
    absolute_redirect off;

    # Resolve upstreams per request via Docker DNS: nginx starts even if a
    # service is still booting and follows containers that get new IPs.
    resolver 127.0.0.11 valid=10s;
    set $django   http://django:8000;
    set $frontend http://frontend:5173;
    set $mailpit  http://mailpit:8025;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # WebSockets: Vite HMR and Mailpit live updates
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;

    location = /mailpit {
        return 301 /mailpit/;
    }

    location /mailpit/ {
        proxy_pass $mailpit;
    }

    location ~ ^/(api|admin|static)(/|$) {
        proxy_pass $django;
    }

    location / {
        proxy_pass $frontend;
    }
}
