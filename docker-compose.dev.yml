# Development / test stack: Vite (hot reload), Django runserver, Postgres and
# Mailpit behind one nginx gateway, so the whole app lives on a single origin:
#
#   /           -> Vite dev server (React app)
#   /api/       -> Django
#   /admin/     -> Django admin
#   /static/    -> Django (admin assets)
#   /mailpit/   -> Mailpit web UI (every email the app sends lands here)
#
# Local:   docker compose -f docker-compose.dev.yml up -d
#          -> http://localhost:8000 (set FRONTEND_BASE_URL=http://localhost:8000)
# Remote:  add docker-compose.dev.remote.yml to attach the gateway to the
#          reverse proxy network (see that file).
#
# Code is bind-mounted, so `git pull` is picked up without a rebuild.
name: bpm-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bpm
      POSTGRES_USER: bpm
      POSTGRES_PASSWORD: bpm_dev_password
    ports:
      # Loopback only: Docker-published ports bypass host firewalls.
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - ./postgresdata-dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpm"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${DEV_MAILPIT_UI_PORT:-8025}:8025"  # Web UI (also at /mailpit/ via the gateway)
      - "127.0.0.1:${DEV_SMTP_PORT:-1025}:1025"  # SMTP
    environment:
      MP_WEBROOT: mailpit
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # Optional basic auth for the UI, e.g. MAILPIT_UI_AUTH="peer:secret"
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    restart: unless-stopped

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=bpm.settings.development
      - POSTGRES_HOST=db
      - POSTGRES_DB=bpm
      - POSTGRES_USER=bpm
      - POSTGRES_PASSWORD=bpm_dev_password
      - EMAIL_SMTP_HOST=mailpit
      - EMAIL_SMTP_PORT=1025
      # Public origin; added to ALLOWED_HOSTS/CSRF in development settings
      # and used for carpool links in emails.
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:8000}
      - SMTP_SENDER_EMAIL=${SMTP_SENDER_EMAIL:-noreply@denog.de}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-DENOG Event Team}
      - EMAIL_BCC_ADDRESS=${EMAIL_BCC_ADDRESS:-sascha@denog.de}
      - PRETIX_API_TOKEN=${PRETIX_API_TOKEN:-}
      - PRETIX_EVENT=${PRETIX_EVENT:-}
      - PRETIX_ORGANIZER=${PRETIX_ORGANIZER:-denog}
      - PRETIX_CHECKIN_LIST_ID_LOCAL=${PRETIX_CHECKIN_LIST_ID_LOCAL:-}
      - PRETIX_CHECKIN_LIST_ID_GLOBAL=${PRETIX_CHECKIN_LIST_ID_GLOBAL:-}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      # Host header(s) Vite accepts besides localhost (comma-separated).
      DEV_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS:-}
    volumes:
      - .:/app
      # Container-native deps; keeps the host's node_modules untouched.
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${DEV_HOST_PORT:-8000}:8000"
    depends_on:
      - django
      - frontend
      - mailpit
    restart: unless-stopped

volumes:
  frontend_node_modules:
