services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bpm
      POSTGRES_USER: bpm
      POSTGRES_PASSWORD: bpm_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpm"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=bpm.settings.development
      - POSTGRES_HOST=db
      - POSTGRES_DB=bpm
      - POSTGRES_USER=bpm
      - POSTGRES_PASSWORD=bpm_dev_password
      - EMAIL_SMTP_HOST=mailpit
      - EMAIL_SMTP_PORT=1025
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - PRETIX_API_TOKEN=${PRETIX_API_TOKEN:-}
      - PRETIX_EVENT=${PRETIX_EVENT:-}
      - PRETIX_CHECKIN_LIST_ID_LOCAL=${PRETIX_CHECKIN_LIST_ID_LOCAL:-}
      - PRETIX_CHECKIN_LIST_ID_GLOBAL=${PRETIX_CHECKIN_LIST_ID_GLOBAL:-}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres_data:
